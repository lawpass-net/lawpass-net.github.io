name: 카페 공지 목록 갱신

on:
  schedule:
    - cron: '17 * * * *'   # 1시간마다(매시 17분, UTC 기준)
  workflow_dispatch:        # 저장소의 작업 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: cafe-notice
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 카페 공지 목록 읽기
        run: node scripts/fetch-cafe.mjs
      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain data/cafe-notice.json)" ]; then
            git config user.name "lawpass-bot"
            git config user.email "lawpass-net@users.noreply.github.com"
            git add data/cafe-notice.json
            git commit -m "카페 공지 목록 갱신"
            git push
          else
            echo "변경 없음"
          fi
